<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Follow-up &amp; Task Agenda — Career Apex CRM</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="app-container">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <div id="header-container"></div>

      <main class="content-area">
        <!-- Page Header -->
        <div class="page-top-bar">
          <div class="page-title-box">
            <h1 class="page-title">Follow-up &amp; Task Agenda</h1>
            <p class="page-subtitle">Counselor touchpoints, scheduled candidate counseling calls, fee reminder agendas, and task completion ledger.</p>
          </div>
          <div class="page-actions-group">
            <button type="button" class="btn-primary-purple" onclick="Followups.openScheduleModal(null, refreshPageData)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              + Schedule Follow-up
            </button>
          </div>
        </div>

        <!-- Agenda Status Tabs (Overdue, Today, Upcoming, Completed) -->
        <div class="enterprise-card" style="padding: 12px 16px; margin-bottom: 20px;">
          <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
            <button type="button" class="btn-outline-sm" id="tab-all" onclick="selectTab('all')">
              All Tasks <span class="badge" id="badge-count-all" style="margin-left: 4px; background: #f1f5f9; color: #475569;">0</span>
            </button>
            <button type="button" class="btn-outline-sm" id="tab-overdue" onclick="selectTab('overdue')" style="color: var(--red); border-color: #fca5a5;">
              ⚠️ Overdue <span class="badge badge-lost" id="badge-count-overdue" style="margin-left: 4px;">0</span>
            </button>
            <button type="button" class="btn-outline-sm" id="tab-today" onclick="selectTab('today')" style="color: var(--amber); border-color: #fde68a;">
              📅 Today <span class="badge" id="badge-count-today" style="margin-left: 4px; background: #fef3c7; color: #d97706;">0</span>
            </button>
            <button type="button" class="btn-outline-sm" id="tab-upcoming" onclick="selectTab('upcoming')" style="color: var(--primary);">
              ⏳ Upcoming <span class="badge" id="badge-count-upcoming" style="margin-left: 4px; background: #eef2ff; color: #4f46e5;">0</span>
            </button>
            <button type="button" class="btn-outline-sm" id="tab-completed" onclick="selectTab('completed')" style="color: var(--green);">
              ✅ Completed <span class="badge badge-converted" id="badge-count-completed" style="margin-left: 4px;">0</span>
            </button>
          </div>
        </div>

        <!-- Filter & Search Toolbar -->
        <div class="enterprise-card" style="margin-bottom: 20px;">
          <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;">
            <div style="flex: 1; min-width: 260px; position: relative;">
              <input type="text" id="followup-search" class="filter-input" placeholder="Search by student name, ID, or task purpose..." style="width: 100%; padding-left: 36px;" oninput="applyFilters()">
              <svg viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" style="position: absolute; left: 10px; top: 10px; width: 16px; height: 16px;">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
            </div>

            <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center;">
              <select id="followup-counselor" class="filter-select" onchange="applyFilters()">
                <option value="">All Counselors</option>
                <option value="Arun Kumar">Arun Kumar</option>
                <option value="Sneha Rao">Sneha Rao</option>
                <option value="Vikram Singh">Vikram Singh</option>
                <option value="Neha Gupta">Neha Gupta</option>
                <option value="Rahul Mehta">Rahul Mehta</option>
              </select>

              <select id="followup-priority" class="filter-select" onchange="applyFilters()">
                <option value="">All Priorities</option>
                <option value="High">High Priority</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
              </select>

              <button type="button" class="btn-outline-sm" onclick="resetFilters()">Reset</button>
            </div>
          </div>
        </div>

        <!-- Follow-ups Table Card -->
        <div class="enterprise-card" style="padding: 0; overflow: hidden;">
          <div style="padding: 14px 20px; border-bottom: 1px solid var(--slate-200); background: #fafbfc; display: flex; justify-content: space-between; align-items: center;">
            <div style="font-weight: 600; font-size: 13px; color: var(--navy-900);">
              Agenda View: <span id="agenda-current-tab-text" style="color: var(--primary);">Today's Tasks</span>
              (<span id="agenda-count">0</span> items)
            </div>
          </div>

          <div class="table-responsive">
            <table class="crm-table">
              <thead>
                <tr>
                  <th>Student Candidate</th>
                  <th>Date &amp; Time</th>
                  <th>Priority</th>
                  <th>Purpose / Agenda Notes</th>
                  <th>Assigned Counselor</th>
                  <th>Status</th>
                  <th>Completed Date / Notes</th>
                  <th style="min-width: 170px;">Actions</th>
                </tr>
              </thead>
              <tbody id="followup-tbody">
                <!-- Dynamically populated rows -->
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/storage.js"></script>
  <script src="../js/seed.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/activities.js"></script>
  <script src="../js/customers.js"></script>
  <script src="../js/pipeline.js"></script>
  <script src="../js/payments.js"></script>
  <script src="../js/followups.js"></script>
  <script src="../js/communication.js"></script>
  <script src="../js/team.js"></script>
  <script src="../js/reports.js"></script>
  <script src="../js/ui.js"></script>

  <script>
    let activeTab = 'today';
    let filteredFollowups = [];

    function updateBadgeCounts() {
      const all = Followups.getAll();
      const todayStr = new Date().toISOString().split('T')[0];

      const overdueCount = all.filter(f => f.status === 'Pending' && f.scheduledDate < todayStr).length;
      const todayCount = all.filter(f => f.status === 'Pending' && f.scheduledDate === todayStr).length;
      const upcomingCount = all.filter(f => f.status === 'Pending' && f.scheduledDate > todayStr).length;
      const completedCount = all.filter(f => f.status === 'Completed').length;

      document.getElementById('badge-count-all').textContent = all.length;
      document.getElementById('badge-count-overdue').textContent = overdueCount;
      document.getElementById('badge-count-today').textContent = todayCount;
      document.getElementById('badge-count-upcoming').textContent = upcomingCount;
      document.getElementById('badge-count-completed').textContent = completedCount;
    }

    function selectTab(tabKey) {
      activeTab = tabKey;

      ['all', 'overdue', 'today', 'upcoming', 'completed'].forEach(k => {
        const btn = document.getElementById(`tab-${k}`);
        if (btn) {
          if (k === tabKey) {
            btn.style.background = 'var(--primary)';
            btn.style.color = '#fff';
            btn.style.borderColor = 'var(--primary)';
          } else {
            btn.style.background = '#ffffff';
            btn.style.color = 'var(--slate-700)';
            btn.style.borderColor = 'var(--slate-200)';
          }
        }
      });

      const labelMap = {
        all: 'All Follow-up Tasks',
        overdue: '⚠️ Overdue Urgent Tasks',
        today: '📅 Today’s Outreach Agenda',
        upcoming: '⏳ Upcoming Scheduled Sessions',
        completed: '✅ Completed Task Log'
      };
      document.getElementById('agenda-current-tab-text').textContent = labelMap[tabKey] || tabKey;

      applyFilters();
    }

    function applyFilters() {
      const search = (document.getElementById('followup-search')?.value || '').toLowerCase();
      const counselor = document.getElementById('followup-counselor')?.value || '';
      const priority = document.getElementById('followup-priority')?.value || '';

      const todayStr = new Date().toISOString().split('T')[0];
      let items = Followups.getAll();

      // Role filter for counselor
      const user = Auth.getCurrentUser();
      if (user && user.role === 'counselor') {
        items = items.filter(f => f.counselor === user.name);
      }

      // Tab filter
      if (activeTab === 'overdue') {
        items = items.filter(f => f.status === 'Pending' && f.scheduledDate < todayStr);
      } else if (activeTab === 'today') {
        items = items.filter(f => f.status === 'Pending' && f.scheduledDate === todayStr);
      } else if (activeTab === 'upcoming') {
        items = items.filter(f => f.status === 'Pending' && f.scheduledDate > todayStr);
      } else if (activeTab === 'completed') {
        items = items.filter(f => f.status === 'Completed');
      }

      filteredFollowups = items.filter(f => {
        if (counselor && f.counselor !== counselor) return false;
        if (priority && f.priority !== priority) return false;
        if (search) {
          const match = (f.studentName || '').toLowerCase().includes(search) ||
                        (f.studentId || '').toLowerCase().includes(search) ||
                        (f.purpose || '').toLowerCase().includes(search);
          if (!match) return false;
        }
        return true;
      });

      renderTable();
    }

    function resetFilters() {
      document.getElementById('followup-search').value = '';
      document.getElementById('followup-counselor').value = '';
      document.getElementById('followup-priority').value = '';
      applyFilters();
    }

    function renderTable() {
      const tbody = document.getElementById('followup-tbody');
      const countEl = document.getElementById('agenda-count');
      if (countEl) countEl.textContent = filteredFollowups.length;

      const todayStr = new Date().toISOString().split('T')[0];

      if (filteredFollowups.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: var(--slate-400); padding: 40px;">No tasks found matching this agenda view.</td></tr>`;
      } else {
        tbody.innerHTML = filteredFollowups.map(f => {
          const isOverdue = f.status === 'Pending' && f.scheduledDate < todayStr;
          return `
            <tr>
              <td>
                <a href="customer-details.html?id=${f.studentId}" style="font-weight: 600; color: var(--primary); text-decoration: none;">
                  ${Utils.escapeHtml(f.studentName)}
                </a>
                <div style="font-size: 11px; color: var(--slate-400); font-family: monospace;">${f.studentId}</div>
              </td>
              <td>
                <div style="font-size: 12px; font-weight: 500; color: ${isOverdue ? 'var(--red)' : 'var(--navy-900)'};">
                  ${f.scheduledDate} ${f.scheduledTime || ''}
                </div>
                ${isOverdue ? '<span class="badge badge-lost" style="font-size: 10px; padding: 1px 5px;">Overdue</span>' : ''}
              </td>
              <td>
                <span class="badge ${f.priority === 'High' ? 'badge-interested' : (f.priority === 'Low' ? 'badge-new' : 'badge-contacted')}">
                  ${f.priority || 'Normal'}
                </span>
              </td>
              <td style="max-width: 240px; font-size: 13px; color: var(--navy-800);">${Utils.escapeHtml(f.purpose)}</td>
              <td><span style="font-size: 12px; color: var(--slate-700);">${Utils.escapeHtml(f.counselor)}</span></td>
              <td>
                <span class="badge ${f.status === 'Completed' ? 'badge-converted' : 'badge-new'}">
                  ${f.status}
                </span>
              </td>
              <td style="font-size: 12px; color: var(--slate-600); max-width: 180px;">
                ${f.status === 'Completed' ? `
                  <div style="color: var(--green); font-weight: 600;">${f.completedDate || 'Completed'}</div>
                  <div style="font-size: 11px; color: var(--slate-500);">${Utils.escapeHtml(f.outcomeNotes || '')}</div>
                ` : '<span style="color: var(--slate-400);">-</span>'}
              </td>
              <td>
                <div class="row-actions">
                  <button class="btn-icon" onclick="Communication.logCall('${f.studentId}', refreshPageData)" title="Call">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                  </button>
                  <button class="btn-icon" onclick="Communication.sendWhatsApp('${f.studentId}', 'followup')" title="WhatsApp">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#25D366" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                  </button>
                  <button class="btn-icon" onclick="Communication.sendEmail('${f.studentId}')" title="Email">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                  </button>
                  ${f.status === 'Pending' ? `
                    <button class="btn-icon" onclick="Followups.openCompleteModal('${f.id}', refreshPageData)" title="Complete Task">
                      <svg viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
                    </button>
                    <button class="btn-icon" onclick="Followups.openScheduleModal('${f.id}', refreshPageData)" title="Edit Task">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    </button>
                  ` : ''}
                  <button class="btn-icon" onclick="deleteFollowup('${f.id}')" title="Delete Task">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                  </button>
                </div>
              </td>
            </tr>
          `;
        }).join('');
      }
    }

    function deleteFollowup(id) {
      if (confirm('Are you sure you want to delete this follow-up task?')) {
        Followups.delete(id);
        refreshPageData();
      }
    }

    function refreshPageData() {
      updateBadgeCounts();
      applyFilters();
    }

    document.addEventListener('DOMContentLoaded', () => {
      UI.init('followups');

      // Check query param for preset filter
      const params = Utils.parseQueryParams();
      if (params.filter) {
        selectTab(params.filter);
      } else {
        selectTab('today');
      }

      updateBadgeCounts();
    });
  </script>
</body>
</html>
